server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        application/javascript application/json text/css image/svg+xml;

    # index.html immer frisch, damit Updates sofort ankommen
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Kartendaten und Code sind versionierte Dateien - kurz cachen reicht
    location ~* \.(json|js|css|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
