# Cache-Steuerung ueber eine Map: so steht add_header nur einmal im
# server-Block. (nginx vererbt add_header NICHT in einen location-Block, der
# selbst add_header benutzt - sonst fielen dort alle Sicherheits-Header weg.)
map $uri $cache_control {
    default        "public, max-age=3600";
    "/"            "no-cache";
    "/index.html"  "no-cache";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # Version nicht ausplaudern
    server_tokens off;

    # Rein statische Seite: lesen genuegt, alles andere wird abgewiesen.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Es gibt nichts hochzuladen, und langsame Verbindungen sollen nicht
    # dauerhaft Worker belegen.
    client_max_body_size  1k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # Die Seite laedt ausschliesslich eigene Dateien - kein CDN, keine Fonts,
    # kein Tracking. Deshalb darf die CSP so streng sein: ohne 'unsafe-inline',
    # ohne 'unsafe-eval', und alles, was nicht gebraucht wird, ist verboten.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        application/javascript application/json text/css image/svg+xml;

    # Punktdateien gehen niemanden etwas an
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
